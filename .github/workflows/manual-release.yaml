name: Manual Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 100
          fetch-tags: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'

      - name: Install dependencies
        run: pnpm ci

      - name: Build MV2 & MV3
        run: |
          pnpm exec run-p ci build
          pnpm build:mv3
        env:
          SYNC_DROPBOX_CLIENT_ID: ${{ secrets.SYNC_DROPBOX_CLIENT_ID }}
          SYNC_GOOGLE_DESKTOP_ID: ${{ secrets.SYNC_GOOGLE_DESKTOP_ID }}
          SYNC_GOOGLE_DESKTOP_SECRET: ${{ secrets.SYNC_GOOGLE_DESKTOP_SECRET }}
          SYNC_ONEDRIVE_CLIENT_ID: ${{ secrets.SYNC_ONEDRIVE_CLIENT_ID }}

      - name: Get version and SHA
        run: node scripts/action-helper.js release

      - name: Package extension archives
        run: |
          mkdir -p dist-assets
          cd dist && zip -r ../dist-assets/Greedymonkey-mv2-${{ env.GIT_DESCRIBE }}.zip . && cd ..
          cd dist-mv3 && zip -r ../dist-assets/Greedymonkey-mv3-${{ env.GIT_DESCRIBE }}.zip . && cd ..

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.GIT_DESCRIBE }}
          name: Greedymonkey ${{ env.GIT_DESCRIBE }}
          files: dist-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
